name: Check Rust semver
description: >
  Checks each library package's public API against a baseline for changes that
  semver says need a new major (or minor) version, with cargo-semver-checks:
  by default the newest release on crates.io, or a git revision, a version or
  a directory. Needs cargo-semver-checks (install with tools:
  cargo-semver-checks), whose release must read the job's toolchain's rustdoc
  JSON (0.51.0 reads Rust 1.97 to 1.99's). A breaking change the version
  number doesn't allow is a finding; cargo-semver-checks failing fails the
  step whatever report_only says. The GitHub Actions twin of the orb's
  semver_checks command.
author: juburr

inputs:
  baseline_rev:
    description: >
      A git revision of this repository to compare with (--baseline-rev), such
      as origin/main or a release tag.
    default: ""
  baseline_root:
    description: >
      A directory holding the baseline's source to compare with
      (--baseline-root).
    default: ""
  baseline_version:
    description: >
      A version from the registry to compare with (--baseline-version).
    default: ""
  extra_args:
    description: >
      More cargo semver-checks check-release arguments, split like shell
      words. Nothing in them is expanded or run. Options the parameters set
      (the baselines, --release-type, --manifest-path), --color and --quiet
      are refused.
    default: ""
  junit:
    description: >
      Also write JUnit XML, one failing test case per failed lint, for a JUnit
      reader such as a test report action.
    default: "true"
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/rust-quality-reports
  packages:
    description: >
      Workspace members to check, by package name, separated by commas or
      spaces. Empty (the default) means every member.
    default: ""
  release_type:
    description: >
      The release to check for, major, minor or patch (--release-type),
      instead of the one the version bump implies.
    default: ""
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json (the
      failed lints) and <report_name>.log (cargo-semver-checks' output),
      <report_name>.run-record.json and junit/<report_name>.xml. Give each run
      of this command in a job its own.
    default: semver-checks
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      cargo-semver-checks failing still fails it.
    default: "false"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which Cargo.toml and Cargo.lock, with which toolchain and settings, and
      what it found.
    default: "false"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      rust-quality-reports-<report_name> and a random suffix, including when
      the step fails.
    default: "true"
  working_dir:
    description: >
      Directory to run in: the root of the Cargo workspace or package, or any
      directory in it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=rust-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: cargo semver-checks
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_BASELINE_REV: ${{ inputs.baseline_rev }}
        PARAM_BASELINE_ROOT: ${{ inputs.baseline_root }}
        PARAM_BASELINE_VERSION: ${{ inputs.baseline_version }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_RELEASE_TYPE: ${{ inputs.release_type }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/semver_checks.sh"
        "SCRIPT_RUST_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/rust_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
