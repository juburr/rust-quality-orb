name: Install Rust
description: >
  Installs one Rust release, pinned, without rustup: rustc, cargo, the
  standard library, and the components named in components, for Linux on amd64
  or arm64, picked from the machine's CPU architecture. The release's channel
  manifest, which the Rust project signs and which lists the SHA-256 of every
  component, is verified against this orb's SHA-512 checksum table, and every
  component against the manifest. Its bin directory goes first on the PATH,
  ahead of rustup's proxies on images that have them, and a
  rust-toolchain.toml has no effect on it. Use install_rustup instead to
  follow rust-toolchain.toml, or for nightly toolchains. The GitHub Actions
  twin of the orb's install_rust command.
author: juburr

inputs:
  caching:
    description: >
      Cache the verified manifest and component archives between jobs (about
      130 MB with clippy and rustfmt), keyed by version, components, targets,
      CPU architecture and home directory. Only archives of a verified
      manifest are cached, and each is verified again before it is used.
    default: "true"
  components:
    description: >
      Components to install besides rustc, cargo and the standard library,
      separated by commas or spaces: any of clippy (the lint command), rustfmt
      (fmt), llvm-tools (coverage) and rust-src.
    default: clippy,rustfmt
  download_base_url:
    description: >
      Base URL of an internal mirror of https://static.rust-lang.org, such as
      an Artifactory or Nexus remote repository, to download the manifest and
      the components from. It replaces https://static.rust-lang.org in every
      download URL, so the mirror must serve the same paths. It must be an
      https:// URL, without credentials (user:password@) or a query or
      fragment, which would show in the log. What is downloaded is still
      verified.
    default: ""
  install_path:
    description: >
      Absolute path of the directory to install Rust into: the toolchain's
      root, whose bin directory is added to the PATH of later steps when it
      isn't already on it. It must be missing, hold no files, or be a Rust
      installation this command installed before, which it replaces, and be
      writable without root. Defaults to $HOME/.rust-quality-orb/rust.
    default: ""
  targets:
    description: >
      Targets to install the standard library for besides the machine's own
      (x86_64-unknown-linux-gnu or aarch64-unknown-linux-gnu), separated by
      commas or spaces, such as x86_64-unknown-linux-musl or
      wasm32-unknown-unknown, for the features command's targets.
    default: ""
  verify_checksums:
    description: >
      SHA-512 verification of the release's manifest against this orb's
      checksum table. "strict" (default) fails before downloading anything
      when the version has no checksum in the table. "known_versions" verifies
      listed versions and installs unlisted versions from an unverified
      manifest, with a warning. "false" skips verification and is not
      recommended. Components are always checked against the manifest.
    default: strict
  version:
    description: >
      Version of Rust to install, such as 1.99.1: a stable release from 1.56.0
      on. A leading "v" is ignored.
    default: "1.99.1"

runs:
  using: composite
  steps:
    # The key is computed from files that name the CPU (uname -m), HOME (a
    # cache is restored to the absolute path it was saved from) and what
    # is installed, as the orb's command computes it.
    - name: Prepare Rust cache key
      if: (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/rust-quality-orb-rust-cache-key
        PARAM_VERSION: ${{ inputs.version }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/cache_key.sh"
    - name: Prepare Rust components cache key
      id: cache-key
      if: (inputs.caching == 'true' || inputs.caching == '1')
      shell: bash
      env:
        ORB_CACHE_KEY_FILE: ${{ runner.temp }}/rust-quality-orb-rust-components-cache-key
        PARAM_COMPONENTS: ${{ inputs.components }}
        PARAM_TARGETS: ${{ inputs.targets }}
      run: |
        bash "${GITHUB_ACTION_PATH}/../../src/scripts/rust_cache_key.sh"
        # Bump the version in the key when an existing checksum table entry
        # changes, so caches saved for the old bytes stop being restored.
        key0=$(sha256sum < "${RUNNER_TEMP}/rust-quality-orb-rust-cache-key" | cut -c1-64)
        key1=$(sha256sum < "${RUNNER_TEMP}/rust-quality-orb-rust-components-cache-key" | cut -c1-64)
        printf 'key=rust-quality-orb-rust-v1-%s-%s\n' "${key0}" "${key1}" >> "${GITHUB_OUTPUT}"
    - name: Restore Rust cache
      id: restore
      if: (inputs.caching == 'true' || inputs.caching == '1')
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rust-quality-orb-rust
        key: ${{ steps.cache-key.outputs.key }}
    - name: Install Rust
      shell: bash
      env:
        PARAM_CACHING: ${{ inputs.caching }}
        PARAM_COMPONENTS: ${{ inputs.components }}
        PARAM_DOWNLOAD_BASE_URL: ${{ inputs.download_base_url }}
        PARAM_INSTALL_PATH: ${{ inputs.install_path }}
        PARAM_TARGETS: ${{ inputs.targets }}
        PARAM_VERIFY_CHECKSUMS: ${{ inputs.verify_checksums }}
        PARAM_VERSION: ${{ inputs.version }}
      run: bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/install/rust/install.sh"
    # A saved cache can't be replaced, so it is only saved when none was
    # restored. Like the orb's save_cache, it is saved right after the
    # step, not at the end of the job.
    - name: Save Rust cache
      if: (inputs.caching == 'true' || inputs.caching == '1') && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/rust-quality-orb-rust
        key: ${{ steps.cache-key.outputs.key }}
