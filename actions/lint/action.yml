name: Run clippy
description: >
  Runs clippy (cargo clippy) and reports every lint it and rustc find, with
  SARIF for code scanning: the default lints, those the crates and
  Cargo.toml's [lints] turn on, and those lint_args adds. Lints run capped at
  warning level, so one the code denies doesn't stop the build and hide the
  rest; each lint at any level is a finding. Needs the clippy component. Code
  that doesn't compile fails the step whatever report_only says. The GitHub
  Actions twin of the orb's lint command.
author: juburr

inputs:
  all_features:
    description: >
      Enable every feature (--all-features).
    default: "false"
  all_targets:
    description: >
      Check tests, examples and benchmarks too (--all-targets), not just
      libraries and binaries.
    default: "true"
  extra_args:
    description: >
      More cargo clippy arguments, split like shell words. Nothing in them is
      expanded or run. They go before --, as cargo options. --message-format
      is refused.
    default: ""
  features:
    description: >
      Features to enable, separated by commas or spaces, as cargo's --features
      takes them (package/feature for a dependency's).
    default: ""
  junit:
    description: >
      Also write JUnit XML, one failing test case per finding, for a JUnit
      reader such as a test report action.
    default: "true"
  lint_args:
    description: >
      Lint options for clippy and rustc, split like shell words, such as -W
      clippy::pedantic -A clippy::module_name_repetitions. They go after --,
      before the --cap-lints warn this command adds, so --cap-lints is
      refused.
    default: ""
  locked:
    description: >
      Pass --locked, so cargo fails instead of changing a Cargo.lock that
      doesn't match Cargo.toml. Needs a committed Cargo.lock.
    default: "false"
  no_default_features:
    description: >
      Leave the default features off (--no-default-features).
    default: "false"
  output_dir:
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to the
      artifact upload.
    default: /tmp/rust-quality-reports
  packages:
    description: >
      Workspace members to check, by package name, separated by commas or
      spaces. Empty (the default) means every member.
    default: ""
  report_name:
    description: >
      The reports' file name, without extension: <report_name>.json (the
      findings), <report_name>.sarif, <report_name>.raw.jsonl (cargo's
      messages), <report_name>.run-record.json and junit/<report_name>.xml.
      Give each run of this command in a job its own.
    default: clippy
  report_only:
    description: >
      Report findings without failing the step, to adopt the check gradually.
      Code that doesn't compile still fails it.
    default: "false"
  run_record:
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which Cargo.toml and Cargo.lock, with which toolchain and settings, and
      what it found.
    default: "false"
  sarif:
    description: >
      Write <report_name>.sarif (SARIF 2.1.0), for code scanning, with each
      lint linked to its documentation.
    default: "true"
  store_artifacts:
    description: >
      Upload output_dir as a workflow artifact, named
      rust-quality-reports-<report_name> and a random suffix, including when
      the step fails.
    default: "true"
  working_dir:
    description: >
      Directory to run in: the root of the Cargo workspace or package, or any
      directory in it.
    default: .

runs:
  using: composite
  steps:
    # Artifact names must be unique in a workflow run, and the same command
    # can run in several jobs or matrix legs, so the name ends in a random
    # suffix.
    - name: Name the reports artifact
      id: artifact
      if: (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      shell: bash
      env:
        REPORT_NAME: ${{ inputs.report_name }}
      run: |
        if [[ ! "${REPORT_NAME}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            REPORT_NAME=reports
        fi
        printf 'name=rust-quality-reports-%s-%s\n' "${REPORT_NAME}" "$(od -An -tx1 -N4 /dev/urandom | tr -d ' \n')" >> "${GITHUB_OUTPUT}"
    - name: clippy
      shell: bash
      working-directory: ${{ inputs.working_dir }}
      env:
        PARAM_ALL_FEATURES: ${{ inputs.all_features }}
        PARAM_ALL_TARGETS: ${{ inputs.all_targets }}
        PARAM_EXTRA_ARGS: ${{ inputs.extra_args }}
        PARAM_FEATURES: ${{ inputs.features }}
        PARAM_JUNIT: ${{ inputs.junit }}
        PARAM_LINT_ARGS: ${{ inputs.lint_args }}
        PARAM_LOCKED: ${{ inputs.locked }}
        PARAM_NO_DEFAULT_FEATURES: ${{ inputs.no_default_features }}
        PARAM_OUTPUT_DIR: ${{ inputs.output_dir }}
        PARAM_PACKAGES: ${{ inputs.packages }}
        PARAM_REPORT_NAME: ${{ inputs.report_name }}
        PARAM_REPORT_ONLY: ${{ inputs.report_only }}
        PARAM_RUN_RECORD: ${{ inputs.run_record }}
        PARAM_SARIF: ${{ inputs.sarif }}
      run: >-
        bash "${GITHUB_ACTION_PATH}/../run_script.sh" "${GITHUB_ACTION_PATH}/../../src/scripts/lint.sh"
        "SCRIPT_RUST_QUALITY_LIB=${GITHUB_ACTION_PATH}/../../src/scripts/lib/rust_quality.sh"
    - name: Upload the reports
      if: always() && (inputs.store_artifacts == 'true' || inputs.store_artifacts == '1')
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ inputs.output_dir }}
        if-no-files-found: ignore
