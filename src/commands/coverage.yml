description: >
  Measures line coverage with cargo-llvm-cov, running the tests (with
  cargo-nextest when nextest is true) on an instrumented build, and writes
  lcov, Cobertura, JSON or HTML reports, failing when coverage is below
  coverage_min. Needs cargo-llvm-cov and the toolchain's llvm-tools component
  (install_rust or install_rustup components: llvm-tools). Tests that fail, or
  don't build, fail the step whatever report_only says, since coverage can't
  be measured.
parameters:
  working_dir:
    type: string
    default: "."
    description: >
      Directory to run in: the root of the Cargo workspace or package, or any
      directory in it.
  packages:
    type: string
    default: ""
    description: >
      Workspace members to measure, by package name, separated by commas or
      spaces. Empty (the default) means every member. Environment variables
      are expanded.
  features:
    type: string
    default: ""
    description: >
      Features to enable, separated by commas or spaces, as cargo's --features
      takes them (package/feature for a dependency's). Environment variables
      are expanded.
  all_features:
    type: boolean
    default: false
    description: >
      Enable every feature (--all-features).
  no_default_features:
    type: boolean
    default: false
    description: >
      Leave the default features off (--no-default-features).
  nextest:
    type: boolean
    default: false
    description: >
      Run the tests with cargo-nextest (cargo llvm-cov nextest) instead of
      cargo test. Needs cargo-nextest.
  formats:
    type: string
    default: lcov,cobertura
    description: >
      Reports to write besides <report_name>.json, separated by commas or
      spaces: lcov (<report_name>.lcov), cobertura
      (<report_name>.cobertura.xml) and html (<report_name>-html/).
  coverage_min:
    type: string
    default: ""
    description: >
      The lowest line coverage that passes, as a percentage such as 80 or
      82.5. Empty reports coverage without a minimum. Environment variables
      are expanded.
  ignore_filename_regex:
    type: string
    default: ""
    description: >
      Leave files whose path matches this regular expression out of the
      reports and the total (--ignore-filename-regex), such as generated code.
      Environment variables are expanded.
  locked:
    type: boolean
    default: false
    description: >
      Pass --locked, so cargo fails instead of changing a Cargo.lock that
      doesn't match Cargo.toml. Needs a committed Cargo.lock.
  extra_args:
    type: string
    default: ""
    description: >
      More cargo llvm-cov arguments, split like shell words. Nothing in them
      is expanded or run; environment variables are expanded before splitting.
      They go to the test run. Options that change the reports (--json,
      --lcov, --cobertura, --html, --text, --output-path, --output-dir,
      --no-report, --fail-under-lines and the like) are refused.
  output_dir:
    type: string
    default: /tmp/rust-quality-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  report_name:
    type: string
    default: coverage
    description: >
      The reports' file name, without extension: <report_name>.json
      (llvm-cov's summary) and the formats, <report_name>.run-record.json and
      junit/<report_name>.xml. Give each run of this command in a job its own.
  junit:
    type: boolean
    default: true
    description: >
      Also write JUnit XML, one test case for coverage_min, and show it in
      CircleCI's Tests tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which Cargo.toml and Cargo.lock, with which toolchain and settings, and
      the coverage it measured.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step, to adopt the check gradually.
      Tests that fail or don't build still fail it.
  store_artifacts:
    type: boolean
    default: true
    description: >
      Store output_dir as job artifacts under rust-quality-reports/, including
      when the step fails.
steps:
  - run:
      name: cargo llvm-cov
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_ALL_FEATURES: << parameters.all_features >>
        PARAM_COVERAGE_MIN: << parameters.coverage_min >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_FEATURES: << parameters.features >>
        PARAM_FORMATS: << parameters.formats >>
        PARAM_IGNORE_FILENAME_REGEX: << parameters.ignore_filename_regex >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_LOCKED: << parameters.locked >>
        PARAM_NEXTEST: << parameters.nextest >>
        PARAM_NO_DEFAULT_FEATURES: << parameters.no_default_features >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PACKAGES: << parameters.packages >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        SCRIPT_RUST_QUALITY_LIB: << include(scripts/lib/rust_quality.sh) >>
      command: << include(scripts/coverage.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: rust-quality-reports
            when: always
