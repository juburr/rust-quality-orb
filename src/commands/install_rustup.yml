description: >
  Installs rustup, verified against this orb's SHA-512 checksum table, and
  then a Rust toolchain with it: the toolchain parameter, or else the one the
  rust-toolchain.toml of the job's working directory names, or else stable.
  rustup checks each toolchain file it downloads against the SHA-256 its
  channel manifest lists. A rustup already installed (as on cimg/rust) is
  replaced by the verified one, and its toolchains stay. Use install_rust
  instead to pin a Rust release with this orb's own checksum table.
parameters:
  caching:
    type: boolean
    default: true
    description: >
      Cache the downloaded rustup-init between jobs, keyed by version, CPU
      architecture and home directory. Only verified files are cached, and a
      cached file is verified again before it is used. Toolchains are not
      cached.
  components:
    type: string
    default: "clippy,rustfmt"
    description: >
      Components to install with the toolchain, separated by commas or
      spaces, by their rustup names: clippy (the lint command), rustfmt
      (fmt), llvm-tools (coverage), and any other rustup has. A
      rust-toolchain.toml can list more. Environment variables are expanded.
  download_base_url:
    type: string
    default: ""
    description: >
      Base URL of an internal mirror of https://static.rust-lang.org, such as
      an Artifactory or Nexus remote repository. It replaces
      https://static.rust-lang.org in the rustup-init URL, and becomes
      RUSTUP_DIST_SERVER for the toolchain downloads, here and in later
      steps, unless RUSTUP_DIST_SERVER is already set. It must be an https://
      URL, without credentials (user:password@) or a query or fragment, which
      would show in the log. Environment variables are expanded.
  install_path:
    type: string
    default: ""
    description: >
      Absolute path of rustup's CARGO_HOME, whose bin directory gets rustup
      and a proxy for each toolchain binary (cargo, rustc, ...) and is added
      to the PATH of later steps when it isn't already on it. It must be
      writable without root. Environment variables are expanded.
      Defaults to $HOME/.cargo. When CARGO_HOME is set, it is the default
      instead. Toolchains go in RUSTUP_HOME, or else $HOME/.rustup, or
      without HOME a .rustup directory beside install_path.
  targets:
    type: string
    default: ""
    description: >
      Targets to install the standard library for besides the machine's own,
      separated by commas or spaces, such as x86_64-unknown-linux-musl or
      wasm32-unknown-unknown, for the features command's targets. Environment
      variables are expanded.
  toolchain:
    type: string
    default: ""
    description: >
      The toolchain to install and make the default, such as stable, 1.99.1,
      beta or nightly-2026-10-01. Empty (the default) installs the one the
      rust-toolchain.toml of the working directory names, with the
      components and targets it lists, or else stable. none installs rustup
      alone. Environment variables are expanded.
  verify_checksums:
    type: enum
    enum: ["false", "known_versions", "strict"]
    default: strict
    description: >
      SHA-512 verification of rustup-init against this orb's checksum table.
      "strict" (default) fails before downloading anything when the version
      has no checksum in the table. "known_versions" verifies listed versions
      and installs unlisted versions unverified, with a warning. "false"
      skips verification and is not recommended.
  version:
    type: string
    default: "1.29.2"
    description: >
      Version of rustup to install, such as 1.29.2: 1.28.0 or newer. A
      leading "v" is ignored, and environment variables are expanded.
steps:
  - when:
      condition: << parameters.caching >>
      steps:
        # The key is computed from a file that names the CPU (uname -m, as
        # {{ arch }} also encodes the CPU model and would split the cache by
        # host), HOME (a cache is restored to the absolute path it was saved
        # from), and the version with environment variables expanded.
        - run:
            name: Prepare rustup cache key
            environment:
              ORB_CACHE_KEY_FILE: /tmp/rust-quality-orb-rustup-cache-key
              PARAM_VERSION: << parameters.version >>
            command: << include(scripts/cache_key.sh) >>
        # A saved cache can't be replaced. Bump v1 when an existing checksum
        # table entry changes, so caches saved for the old bytes stop being
        # restored.
        - restore_cache:
            key: rust-quality-orb-rustup-v1-<< parameters.version >>-{{ checksum "/tmp/rust-quality-orb-rustup-cache-key" }}
  - run:
      name: Install rustup << parameters.version >>
      environment:
        PARAM_CACHING: << parameters.caching >>
        PARAM_COMPONENTS: << parameters.components >>
        PARAM_DOWNLOAD_BASE_URL: << parameters.download_base_url >>
        PARAM_INSTALL_PATH: << parameters.install_path >>
        PARAM_TARGETS: << parameters.targets >>
        PARAM_TOOLCHAIN: << parameters.toolchain >>
        PARAM_VERIFY_CHECKSUMS: << parameters.verify_checksums >>
        PARAM_VERSION: << parameters.version >>
      command: << include(install/rustup/install.sh) >>
  - when:
      condition: << parameters.caching >>
      steps:
        - save_cache:
            key: rust-quality-orb-rustup-v1-<< parameters.version >>-{{ checksum "/tmp/rust-quality-orb-rustup-cache-key" }}
            paths:
              - ~/.cache/rust-quality-orb-rustup
