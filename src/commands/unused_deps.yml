description: >
  Finds dependencies Cargo.toml declares that the code never uses,
  dependencies in the wrong section (a dev-dependency the library uses, for
  example), and source files no module includes, with cargo-shear, which
  parses the source without compiling it. Needs cargo-shear (install with
  tools: cargo-shear). Mark false positives, such as a crate only a macro
  uses, in Cargo.toml's [package.metadata.cargo-shear] ignored. cargo-shear
  failing fails the step whatever report_only says.
parameters:
  working_dir:
    type: string
    default: "."
    description: >
      Directory to run in: the root of the Cargo workspace or package, or any
      directory in it.
  packages:
    type: string
    default: ""
    description: >
      Workspace members to check, by package name, separated by commas or
      spaces. Empty (the default) means every member. Environment variables
      are expanded.
  deny_warnings:
    type: boolean
    default: false
    description: >
      Count cargo-shear's warnings (empty files, unused optional dependencies)
      as findings too (--deny-warnings), not just its errors.
  locked:
    type: boolean
    default: false
    description: >
      Pass --locked, so cargo fails instead of changing a Cargo.lock that
      doesn't match Cargo.toml. Needs a committed Cargo.lock.
  extra_args:
    type: string
    default: ""
    description: >
      More cargo shear arguments, split like shell words. Nothing in them is
      expanded or run; environment variables are expanded before splitting.
      Options that change the check or its output (--format, --fix,
      --deny-warnings) are refused, and so is a directory: it checks
      working_dir.
  output_dir:
    type: string
    default: /tmp/rust-quality-reports
    description: >
      Absolute path of the directory to write the reports into. Environment
      variables are not expanded, since the path is also passed to
      store_artifacts and store_test_results.
  report_name:
    type: string
    default: unused-deps
    description: >
      The reports' file name, without extension: <report_name>.json
      (cargo-shear's report, with each finding's line and column) and
      <report_name>.log (its log), <report_name>.run-record.json and
      junit/<report_name>.xml. Give each run of this command in a job its own.
  junit:
    type: boolean
    default: true
    description: >
      Also write JUnit XML, one failing test case per finding, and show it in
      CircleCI's Tests tab.
  run_record:
    type: boolean
    default: false
    description: >
      Also write a run record (<report_name>.run-record.json): what ran, on
      which Cargo.toml and Cargo.lock, with which toolchain and settings, and
      what it found.
  report_only:
    type: boolean
    default: false
    description: >
      Report findings without failing the step, to adopt the check gradually.
      cargo-shear failing still fails it.
  store_artifacts:
    type: boolean
    default: true
    description: >
      Store output_dir as job artifacts under rust-quality-reports/, including
      when the step fails.
steps:
  - run:
      name: cargo shear
      working_directory: << parameters.working_dir >>
      environment:
        PARAM_DENY_WARNINGS: << parameters.deny_warnings >>
        PARAM_EXTRA_ARGS: << parameters.extra_args >>
        PARAM_JUNIT: << parameters.junit >>
        PARAM_LOCKED: << parameters.locked >>
        PARAM_OUTPUT_DIR: << parameters.output_dir >>
        PARAM_PACKAGES: << parameters.packages >>
        PARAM_REPORT_NAME: << parameters.report_name >>
        PARAM_REPORT_ONLY: << parameters.report_only >>
        PARAM_RUN_RECORD: << parameters.run_record >>
        SCRIPT_RUST_QUALITY_LIB: << include(scripts/lib/rust_quality.sh) >>
      command: << include(scripts/unused_deps.sh) >>
  - when:
      condition: << parameters.junit >>
      steps:
        - store_test_results:
            path: << parameters.output_dir >>/junit/<< parameters.report_name >>.xml
            when: always
  - when:
      condition: << parameters.store_artifacts >>
      steps:
        - store_artifacts:
            path: << parameters.output_dir >>
            destination: rust-quality-reports
            when: always
